name: Build Sovereign Serve Native v1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-native-v16.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sovereign-serve-v16-build
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat native-v16/parts/* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo "e67b2dad735e04c24b00bb4f55296a70e3d4af3008c3c486e87b6d837a247c8c  /tmp/source.zip" | sha256sum -c -
          rm -rf native-v16/buildsrc
          mkdir -p native-v16/buildsrc
          unzip -q /tmp/source.zip -d native-v16/buildsrc

      - name: Build unsigned release
        working-directory: native-v16/buildsrc/SovereignStandard
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Publish unsigned APK to build branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-v16/output
          APK="$(find native-v16/buildsrc/SovereignStandard/app/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" native-v16/output/Sovereign-Serve-v1.6-unsigned.apk
          rm -rf native-v16/buildsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-v16/output/Sovereign-Serve-v1.6-unsigned.apk
          git commit -m "Build Sovereign Serve v1.6 unsigned APK"
          git push origin HEAD:agent/sovereign-serve-v16-build
