name: Build Sovereign Serve Native v1.6

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'native-v16/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat native-v16/parts/* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo "e67b2dad735e04c24b00bb4f55296a70e3d4af3008c3c486e87b6d837a247c8c  /tmp/source.zip" | sha256sum -c -
          mkdir -p native-v16/buildsrc
          unzip -q /tmp/source.zip -d native-v16/buildsrc

      - name: Build unsigned release
        working-directory: native-v16/buildsrc/SovereignStandard
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Serve-v1.6-unsigned
          path: native-v16/buildsrc/SovereignStandard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
