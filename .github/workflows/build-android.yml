name: Build Sovereign Serve Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check Out Native v1.6 Build Branch
        uses: actions/checkout@v4
        with:
          ref: agent/sovereign-serve-v16-build
          fetch-depth: 0

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct Native Source
        shell: bash
        run: |
          set -euo pipefail
          cat native-v16/parts/* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo "e67b2dad735e04c24b00bb4f55296a70e3d4af3008c3c486e87b6d837a247c8c  /tmp/source.zip" | sha256sum -c -
          rm -rf native-v16/buildsrc
          mkdir -p native-v16/buildsrc
          unzip -q /tmp/source.zip -d native-v16/buildsrc

      - name: Build Unsigned Release APK
        working-directory: native-v16/buildsrc/SovereignStandard
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Serve-v1.6-unsigned
          path: native-v16/buildsrc/SovereignStandard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish Run ID
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-v16/buildsrc
          printf '%s\n' "$GITHUB_RUN_ID" > native-v16/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-v16/run-id.txt
          git commit -m "Record v1.6 build run $GITHUB_RUN_ID"
          git push origin HEAD:agent/sovereign-serve-v16-build
